name: Build Windows Portable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Windows icons (DAKA logo)
        run: |
          python -m pip install pillow -q
          python desktop/scripts/make_icons.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: daka-stage2-windows-portable
          path: desktop/dist/*.exe
          if-no-files-found: error
