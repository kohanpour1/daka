name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets into Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -f www/index.html www/app.css www/app.js www/export-fix.js android/app/src/main/assets/www/
          # Ensure SheetJS is present offline in the APK
          if [ -f www/xlsx.full.min.js ]; then
            cp -f www/xlsx.full.min.js android/app/src/main/assets/www/
          else
            curl -fsSL -o android/app/src/main/assets/www/xlsx.full.min.js \
              "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          fi
          ls -la android/app/src/main/assets/www/

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin || true
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daka-stage2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
