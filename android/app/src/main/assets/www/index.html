<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#3e5344" />
  <title>ثبت کد تأیید | DK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    window.__xlsxReady = false;
    function __markXlsx(){ if (typeof XLSX !== 'undefined') window.__xlsxReady = true; }
    function __loadXlsx(src, next){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ __markXlsx(); };
      s.onerror = function(){ if (next) next(); };
      document.head.appendChild(s);
    }
    __loadXlsx('xlsx.full.min.js', function(){
      __loadXlsx('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', function(){
        __loadXlsx('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      });
    });
  </script>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="page1" class="page">
    <header class="top">
      <div class="logo">DK</div>
      <h1>مشخصات محل و کاربر</h1>
      <p class="sub">یک‌بار وارد کنید؛ دفعات بعد ذخیره می‌ماند</p>
    </header>
    <main class="center">
      <label class="lbl">استان
        <input id="ostan" class="box" type="text" autocomplete="off" />
      </label>
      <label class="lbl">شهرستان
        <input id="shahrestan" class="box" type="text" autocomplete="off" />
      </label>
      <label class="lbl">بخش
        <input id="bakhsh" class="box" type="text" autocomplete="off" />
      </label>
      <label class="lbl">روستا
        <input id="roosta" class="box" type="text" autocomplete="off" />
      </label>
      <label class="lbl">شرکت تعاونی
        <input id="taavoni" class="box" type="text" autocomplete="off" />
      </label>
      <label class="lbl">نام کاربر
        <input id="username" class="box" type="text" autocomplete="off" />
      </label>
      <button type="button" id="btnGo" class="btn main">ثبت و ادامه</button>
      <p id="p1msg" class="msg"></p>
    </main>
    <footer class="foot">شرکت کیهان سازه پارت · ۰۹۱۵۷۴۰۷۶۱۷ · DAKA</footer>
  </div>

  <div id="page2" class="page hidden">
    <header class="top">
      <div class="logo">DK</div>
      <h1>ثبت کد تأیید</h1>
      <p class="sub" id="placeLine"></p>
      <button type="button" id="btnEditPlace" class="linkish">تغییر مشخصات محل / کاربر</button>
    </header>
    <main class="center">
      <label class="lbl">کد ملی
        <input id="nid" class="box big" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="۱۰ رقم" />
      </label>
      <label class="lbl">کد تأیید
        <input id="code" class="box big" type="text" autocomplete="off" placeholder="کد تأیید" />
      </label>
      <button type="button" id="btnSave" class="btn main">ثبت</button>
      <p id="p2msg" class="msg"></p>

      <div class="count-bar">
        <span>تعداد ثبت‌شده: <b id="countNum">۰</b></span>
        <button type="button" id="btnToggleList" class="btn soft">نمایش / ویرایش</button>
      </div>

      <div id="listPanel" class="list-panel hidden">
        <div id="listBody"></div>
      </div>

      <div class="actions">
        <button type="button" id="btnExport" class="btn main">خروجی اکسل</button>
        <button type="button" id="btnNewFile" class="btn soft">ایجاد فایل جدید</button>
        <button type="button" id="btnClear" class="btn danger">پاکسازی همه</button>
      </div>
    </main>
    <footer class="foot">شرکت کیهان سازه پارت · ۰۹۱۵۷۴۰۷۶۱۷ · DAKA</footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
